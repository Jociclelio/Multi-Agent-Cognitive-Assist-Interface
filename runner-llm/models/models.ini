[*]
cache-type-k = q8_0
cache-type-v = q8_0
cache-reuse = 256
parallel = 1
flash-attn = on
mlock = 1
jinja = 1
threads = 5
cache-ram = 2048
sleep-idle-seconds = 300
ctx-size = 8192
ngl = all
batch-size = 4096
ubatch-size = 512

# Modelo menor: PTQ1_0 (5,6 GB) + mmproj. Recorte enxuto da origem:
# a seção PQ2_0/MTP foi descartada. O alias mantém compatibilidade com
# LLAMA_CPP_MODEL=bonsai2-pq2-0 usado nos notebooks e no .env.example.
[bonsai2-ptq1-0]
model = models/Ternary-Bonsai-2-27B-gguf/Ternary-Bonsai-2-27B-PTQ1_0.gguf
mmproj = models/Ternary-Bonsai-2-27B-gguf/Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf
ctx-size = 32768
alias = bonsai2-pq2-0
