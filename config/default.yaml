# Configuração inicial do EduAgent-OS v0.1 — mapa normativo
# fase2/documentos/04_mapa_completo_do_sistema.md §3.
#
# ATENÇÃO: todos os valores numéricos são DEFAULTS DE ENSAIO a calibrar no
# hardware registrado antes do congelamento experimental — NÃO são resultados
# medidos (mapa §1, §3).

# Timezone não fixado: America/Sao_Paulo somente após confirmação explícita
# (mapa §3; pendência registrada na task 001).
timezone: null

network_enabled: false          # mapa §3; curadoria web fica CONNECTOR_DISABLED (§6)
calendar_sync_enabled: false    # mapa §3; ICS local obrigatório não depende de sync (§9)

# Janela e orçamento de contexto (mapa §3; §7: input + 16384 + 2048 + 1024 <= 32768)
window: 32768
max_output_tokens: 16384
tool_reserve: 2048
margin: 1024
doc_tokens: 4096
memory_tokens: 2048

# Limites de execução (mapa §3, §12)
max_llm_calls: 6
max_tool_calls: 8
max_graph_steps: 16
max_repairs_total: 2
max_repair_artifact: 1
active_deadline_s: 120
llm_timeout_s: 90

# Recuperação (mapa §3, §6.5-§6.6)
retrieval_top_k: 40
rrf_k: 60
rerank_candidates: 40
evidence_chunks: 6

# Solver e agenda (mapa §3, §9)
solver_budget_s: 10
slot_minutes: 15
horizon_days: 7
seed: 0
num_workers: 1

# Ingestão (mapa §3): máximos iniciais; oversized é recusado ou dividido pelo
# usuário; ajustar no hardware registrado (§3, §12).
ingestion:
  max_size_mib: 50
  max_pages: 500
  timeout_s: 600
  subprocess_mem_gib: 4

# Reranker opcional BAAI/bge-reranker-v2-m3 (mapa §6.6): configuração inicial
# SEM reranker; seleção em validação — decisão pendente, não fechada aqui.
reranker_enabled: false

# Conector de busca web (mapa §6): sem conector escolhido/configurado,
# CONNECTOR_DISABLED.
search_connector: null          # CONNECTOR_DISABLED

# Modo do modelo (mapa §3.1): non-thinking primeiro; thinking só comparado em
# desenvolvimento; perfil final é congelado no manifesto (task 002/017).
model_mode: non-thinking
